<!DOCTYPE html>
<html lang="en">
<head>
    <title>Grid example</title>
</head>
<style>
.container{
    display:grid;
    grid-template-columns:auto auto auto ;

}
</style>
<body>
    <div class="container">
        <div>item 1</div>
        <div>item 2</div>
        <div>item 3</div>
        <div>item 4</div>
        <div>item 5</div>
    </div>
</body>
</html>
